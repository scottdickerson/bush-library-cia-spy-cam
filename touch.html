<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Spycam Touch</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; cursor: none; user-select: none; }
  video { width: 100%; height: 100%; object-fit: contain; }
</style>
</head>
<body>
<!-- sub.mp4: "Place right hand" → scanning → "Access granted" (10s) -->
<video id="v" src="media/sub.mp4" muted playsinline preload="auto"></video>
<script>
  const v = document.getElementById('v');
  let running = false;

  function startScan() {
    if (running) return;
    running = true;
    v.currentTime = 0;
    v.play();
    spycam.send('scan');
  }

  // Idle on the first frame ("Place right hand"); stays on "Access granted"
  // after playing until the main screen finishes its sequence.
  spycam.on('reset', () => { running = false; v.pause(); v.currentTime = 0; });

  document.addEventListener('pointerdown', startScan);
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') spycam.send('quit'); });
</script>
</body>
</html>
