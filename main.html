<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Spycam Main</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; cursor: none; }
  /* Stage is the video's native 1280x1024, scaled to fit the screen, so the
     camera box coordinates below stay in the video's own pixels. */
  #stage { position: absolute; left: 50%; top: 50%; width: 1280px; height: 1024px; transform-origin: 0 0; }
  #movie { position: absolute; inset: 0; width: 100%; height: 100%; }
  #cam { position: absolute; object-fit: cover; opacity: 0; transition: opacity .4s;
         filter: grayscale(1) contrast(1.6) brightness(1.1) sepia(1) hue-rotate(55deg) saturate(4); }
  #cam.on { opacity: 1; }
  #scanlines { position: absolute; pointer-events: none; opacity: 0; transition: opacity .4s;
               background: repeating-linear-gradient(transparent 0 2px, rgba(0,0,0,.35) 2px 4px); }
  #scanlines.on { opacity: 1; }
</style>
</head>
<body>
<div id="stage">
  <video id="movie" src="media/main.mp4" muted playsinline preload="auto"></video>
  <video id="cam" muted playsinline autoplay></video>
  <div id="scanlines"></div>
</div>
<script>
  // Calibration: measured from main.mp4, where the "LIVE FEED FROM THERMAL
  // X-RAY SENSOR" box is empty black. Nudge these if the feed looks misaligned.
  const CAM_BOX = { left: 342, top: 155, width: 882, height: 660 };
  const CAM_START = 40.8; // seconds: box goes black
  const CAM_END = 61.7;   // seconds: box turns to static before "DATA DOWNLINK LOST"
  // Substring of the capture device's name to prefer; '' = first camera found.
  const CAMERA_LABEL = '';

  const stage = document.getElementById('stage');
  const movie = document.getElementById('movie');
  const cam = document.getElementById('cam');
  const lines = document.getElementById('scanlines');

  for (const el of [cam, lines]) {
    Object.assign(el.style, {
      left: CAM_BOX.left + 'px', top: CAM_BOX.top + 'px',
      width: CAM_BOX.width + 'px', height: CAM_BOX.height + 'px',
    });
  }

  function fit() {
    const s = Math.min(innerWidth / 1280, innerHeight / 1024);
    stage.style.transform = `scale(${s}) translate(-50%, -50%)`;
  }
  addEventListener('resize', fit);
  fit();

  async function startCamera() {
    try {
      let constraints = { video: { width: 1280, height: 960 } };
      if (CAMERA_LABEL) {
        await navigator.mediaDevices.getUserMedia({ video: true }); // unlocks device labels
        const devices = await navigator.mediaDevices.enumerateDevices();
        const d = devices.find((d) => d.kind === 'videoinput' && d.label.includes(CAMERA_LABEL));
        if (d) constraints.video.deviceId = { exact: d.deviceId };
      }
      cam.srcObject = await navigator.mediaDevices.getUserMedia(constraints);
    } catch (err) {
      // No camera: the sequence still runs, the box just stays black.
      console.error('Camera unavailable:', err);
    }
  }
  startCamera();

  function tick() {
    const t = movie.currentTime;
    const on = !movie.paused && t >= CAM_START && t < CAM_END;
    cam.classList.toggle('on', on);
    lines.classList.toggle('on', on);
    if (!movie.paused) requestAnimationFrame(tick);
  }

  spycam.on('scan', () => {
    movie.currentTime = 0;
    movie.play();
    requestAnimationFrame(tick);
  });

  movie.addEventListener('ended', () => {
    cam.classList.remove('on');
    lines.classList.remove('on');
    movie.currentTime = 0;
    spycam.send('reset');
  });

  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') spycam.send('quit'); });
</script>
</body>
</html>
